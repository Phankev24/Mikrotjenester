spring:
  application:
    name: vendor                     # Navnet Consul og andre tjenester bruker (lb://vendor)

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        hostname: localhost
        prefer-ip-address: false
        instance-id: ${spring.application.name}-${random.value}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

  datasource:
    url: jdbc:h2:mem:vendordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8082
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    config-url: /vendor/v3/api-docs/swagger-config
    url: /vendor/v3/api-docs

event:
  service:
    url: http://localhost:8080

app:
  internal:
    secured: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info"