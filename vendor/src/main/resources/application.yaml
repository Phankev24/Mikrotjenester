spring:
  application:
    name: vendor

  flyway:
    enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5434/vendorPlanerManager
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8082
