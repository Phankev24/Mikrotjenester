spring:
  application:
    name: vendor                     # Navnet Consul og andre tjenester bruker (lb://vendor)

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost
      port: 8500

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak-realmen. Vendor henter signeringsnøklene herfra, så ingen hemmelighet lagres i vendor.
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8180/realms/planer}

          app:
            google:
              client-id: ${GOOGLE_CLIENT_ID:}

  flyway:
    enabled: false                   # Av mens Flyway/PostgreSQL-versjonsproblemet er åpent

  datasource:
    url: jdbc:postgresql://localhost:5434/vendorPlanerManager
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update               # Hibernate bygger tabellen. Bytt til "validate" når Flyway eier skjemaet
    # Ingen tvunget PostgreSQL-dialekt: Hibernate finner den selv, og en tvunget dialekt ødelegger H2.

server:
  port: 8082
  # error:
  #   include-message: always       # Kun dev: viser feilmeldinger som "Vendor not found" i svaret

event:
  service:
    url: http://localhost:8080       # Event-tjenestens port (bekreftet fra loggene)

app:
  internal:
    secured: false                   # true = /internal/** krever token med rollen SERVICE (event må da sende token)


springdoc:
  swagger-ui:
    oauth:
      client-id: swagger
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"       # Consul-helsesjekken kaller /actuator/health