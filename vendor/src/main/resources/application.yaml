spring:
  application:
    name: vendor                     # Name Consul and other services use (lb://vendor)

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost
      port: 8500

  flyway:
    enabled: false                   # Off while the Flyway/PostgreSQL version issue is open

  datasource:
    url: jdbc:postgresql://localhost:5434/vendorPlanerManager
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update               # Hibernate builds the table. Switch to "validate" once Flyway owns the schema

server:
  port: 8082
  # error:
  #   include-message: always       # Dev only: shows "Vendor not found" etc. in error responses

event:
  service:
    url: http://localhost:8080       # Event service's real port (confirmed from its logs)

management:
  endpoints:
    web:
      exposure:
        include: "health,info"       # Consul's health check calls /actuator/health