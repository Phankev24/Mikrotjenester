spring:
  application:
    name: user

  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  config:
    import: "optional:consul:,optional:file:.env[.properties]"

  cloud:
    consul:
      host: localhost
      port: 8500

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

server:
  port: 8081

management:
  server:
    port: 8081

services:
  event:
    url: http://localhost:8080