spring:
  application:
    name: gateway

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        hostname: localhost
        prefer-ip-address: false

    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: event
              uri: lb://event
              predicates:
                - Path=/api/event/**, /api/client/event/**

            - id: vendor
              uri: lb://vendor
              predicates:
                - Path=/api/vendor/**, /api/vendors/**

            - id: user
              uri: lb://user
              predicates:
                - Path=/api/user/**, /api/auth/**, /oauth2/**, /login/oauth2/**
server:
  port: 8100

management:
  endpoints:
    web:
      exposure:
        include: "health,info"