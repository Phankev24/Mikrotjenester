spring:
  application:
    name: gateway

  config:
    import: "optional:consul:"

  cloud:
    loadbalancer:
      cache:
        ttl: 2s
    consul:
      host: consul
      port: 8500
      discovery:
        prefer-ip-address: true

    gateway:
      discovery:
        locator:
          enabled: true
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                  - "http://localhost:8100"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: event
              uri: lb://event
              predicates:
                - Path=/api/event/**, /api/client/event/**

            - id: vendor
              uri: lb://vendor
              predicates:
                - Path=/api/vendor/**, /api/vendors/**

            - id: user
              uri: lb://user
              predicates:
                - Path=/api/user/**, /api/auth/**, /oauth2/**, /login/oauth2/**

            - id: event-swagger
              uri: lb://event
              predicates:
                - Path=/event/swagger-ui/**, /event/v3/api-docs, /event/v3/api-docs/**
              filters:
                - RewritePath=/event/(?<segment>.*), /${segment}

            - id: vendor-swagger
              uri: lb://vendor
              predicates:
                - Path=/vendor/swagger-ui/**, /vendor/v3/api-docs, /vendor/v3/api-docs/**
              filters:
                - RewritePath=/vendor/(?<segment>.*), /${segment}

            - id: user-swagger
              uri: lb://user
              predicates:
                - Path=/user/swagger-ui/**, /user/v3/api-docs, /user/v3/api-docs/**
              filters:
                - RewritePath=/user/(?<segment>.*), /${segment}
server:
  port: 8100

management:
  endpoints:
    web:
      exposure:
        include: "health,info"