spring:
  application:
    name: gateway

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost
      port: 8500

    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: event
              uri: lb://event
              predicates:
                - Path=/api/event/**

            - id: vendor
              uri: lb://vendor
              predicates:
                - Path=/api/vendor/**

            - id: user
              uri: lb://user
              predicates:
                - Path=/api/user/**
server:
  port: 8100

management:
  endpoints:
    web:
      exposure:
        include: "health,info"